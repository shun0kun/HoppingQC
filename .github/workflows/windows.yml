name: Build HoppingQC for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install pyinstaller numpy scipy matplotlib

      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --name HoppingQC HoppingQC_GUI.py

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: HoppingQC-Windows
          path: dist/HoppingQC.exe
